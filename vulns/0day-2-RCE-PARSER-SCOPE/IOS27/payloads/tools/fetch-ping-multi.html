<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="v">MP_BOOT</div>
<script>
function S(s){try{document.getElementById("v").textContent=String(s);}catch(e){}}
var got={},tot=0,n=0;
function R(i){
 try{
  TelegramWidget.request("E"+i).then(function(a){
    var r=(a&&a.result)||"";
    got[i]=r.length;tot+=r.length;n++;
    S("GOT"+n+" i="+i+" len="+r.length+" tot="+tot);
  },function(e){ S("REJ i="+i+" "+((e&&(e.code||e.name))||e)); });
 }catch(e){S("EXC "+e);}
}
R(0);R(1);R(2);R(3);
</script>
</body></html>
