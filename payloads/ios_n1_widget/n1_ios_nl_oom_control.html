<!doctype html><body><div id="v">N</div>
<script>
"use strict";
globalThis.NLN={stage:'init',f:-1};
function nlPaint(s){try{var v=document.getElementById('v');if(v)v.textContent=s;}catch(e){}}
nlPaint('NLN PRE');
function probeFree(cap){var lo=0,hi=cap;while(lo<hi){var mid=(lo+hi+1)>>1,ok=false;try{var p=new ArrayBuffer(mid);ok=true;p=null;}catch(e){}if(ok)lo=mid;else hi=mid-1;}return lo;}
function fillDown(lim,K,TGT){var arr=[],l=lim,ok=false,i;for(i=0;i<7&&!ok;i++){try{arr.push(new Uint8Array(l-(1<<20)));ok=true;}catch(e){l>>=1;}}if(!ok){return{a:arr,f:-1};}var f=probeFree(1<<21),g=0;while(f>=(1<<21)&&g++<8){arr.push(new Uint8Array(1<<20));f=probeFree(1<<21);}var need=f-(K+TGT);if(need>0)try{arr.push(new Uint8Array(need));}catch(e){}return{a:arr,f:f};}
globalThis.NLKEEP=fillDown(8388608,14000,0);
globalThis.NLN.f=globalThis.NLKEEP.f;
globalThis.NLN.stage='pre';
var NLA=new Uint8Array(20000);
globalThis.NLN.stage='post';
nlPaint('NLN POST');
</script>
<script>
"use strict";
try{
  globalThis.NLKEEP=null;
  var st=(typeof NLN!=='undefined'&&NLN.stage)?NLN.stage:'none';
  var f=(typeof NLN!=='undefined')?NLN.f:'?';
  var s='NLN B stage='+st+' f='+f;
  var v=document.getElementById('v');if(v)v.textContent=s;
}catch(e){}
</script>
</body></html>
